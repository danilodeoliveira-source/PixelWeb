<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Studio Web</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Ensure crisp pixelated rendering on canvases */
        canvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        /* Dark checkerboard pattern for transparent canvas background */
        .checkerboard {
            background-color: #0f172a;
            background-image: 
                linear-gradient(45deg, #1e293b 25%, transparent 25%), 
                linear-gradient(-45deg, #1e293b 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #1e293b 75%), 
                linear-gradient(-45deg, transparent 75%, #1e293b 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }

        /* Custom scrollbar styling */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }

        .tool-btn.active {
            background-color: #4f46e5;
            color: #ffffff;
            box-shadow: 0 0 12px rgba(79, 70, 229, 0.4);
        }

        .frame-card.active {
            border-color: #6366f1;
            box-shadow: 0 0 0 2px #6366f1;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col overflow-hidden">

    <!-- Cabeçalho Principal / Barra Superior -->
    <header class="bg-slate-900 border-b border-slate-800 px-4 py-2.5 flex items-center justify-between z-20 shrink-0">
        <div class="flex items-center space-x-3">
            <div class="bg-gradient-to-tr from-indigo-600 to-violet-500 p-2 rounded-xl text-white shadow-lg shadow-indigo-500/20">
                <i class="fa-solid fa-border-all text-xl"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg tracking-wide bg-gradient-to-r from-indigo-400 to-violet-300 bg-clip-text text-transparent">
                    Pixel Studio Web
                </h1>
                <p class="text-xs text-slate-400">Editor e Estúdio de Animação em Pixel Art</p>
            </div>
        </div>

        <!-- Controles de Grade -->
        <div class="flex items-center space-x-4">
            <div class="flex items-center space-x-2 bg-slate-800 p-1 rounded-xl border border-slate-700/60">
                <span class="text-xs text-slate-400 pl-2 font-medium">Tamanho:</span>
                <button onclick="setGridSize(16)" id="btn-grid-16" class="px-2.5 py-1 text-xs font-semibold rounded-lg text-slate-400 hover:text-white transition">16x16</button>
                <button onclick="setGridSize(32)" id="btn-grid-32" class="px-2.5 py-1 text-xs font-semibold rounded-lg text-slate-400 hover:text-white transition">32x32</button>
                <button onclick="setGridSize(64)" id="btn-grid-64" class="px-2.5 py-1 text-xs font-semibold rounded-lg bg-indigo-600 text-white transition">64x64</button>
            </div>

            <button id="toggle-grid-btn" onclick="toggleGrid()" class="px-3.5 py-1.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl text-xs font-medium flex items-center space-x-2 transition">
                <i class="fa-solid fa-table-cells text-indigo-400"></i>
                <span>Grade: <strong id="grid-status-text" class="text-emerald-400">ON</strong></span>
            </button>
        </div>

        <!-- Botões de Exportação -->
        <div class="flex items-center space-x-2">
            <button onclick="exportFrame()" class="px-3.5 py-1.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-indigo-300 rounded-xl text-xs font-semibold flex items-center space-x-2 transition">
                <i class="fa-solid fa-download"></i>
                <span>Baixar PNG</span>
            </button>
            <button onclick="exportSpriteSheet()" class="px-3.5 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-semibold flex items-center space-x-2 shadow-lg shadow-indigo-600/30 transition">
                <i class="fa-solid fa-file-image"></i>
                <span>Sprite Sheet</span>
            </button>
        </div>
    </header>

    <!-- Área Central de Trabalho -->
    <div class="flex flex-1 overflow-hidden relative">

        <!-- Barra de Ferramentas Esquerda -->
        <aside class="w-16 bg-slate-900 border-r border-slate-800 flex flex-col items-center py-4 space-y-3 z-10 shrink-0">
            <button onclick="selectTool('pencil')" id="tool-pencil" class="tool-btn active w-11 h-11 rounded-xl bg-slate-800 text-slate-300 hover:bg-slate-700 flex items-center justify-center transition" title="Lápis (B)">
                <i class="fa-solid fa-pencil text-base"></i>
            </button>
            <button onclick="selectTool('select')" id="tool-select" class="tool-btn w-11 h-11 rounded-xl bg-slate-800 text-slate-300 hover:bg-slate-700 flex items-center justify-center transition" title="Seleção Retangular (S)">
                <i class="fa-regular fa-square text-base"></i>
            </button>
            <button onclick="selectTool('eraser')" id="tool-eraser" class="tool-btn w-11 h-11 rounded-xl bg-slate-800 text-slate-300 hover:bg-slate-700 flex items-center justify-center transition" title="Borracha (E)">
                <i class="fa-solid fa-eraser text-base"></i>
            </button>
            <button onclick="selectTool('bucket')" id="tool-bucket" class="tool-btn w-11 h-11 rounded-xl bg-slate-800 text-slate-300 hover:bg-slate-700 flex items-center justify-center transition" title="Balde de Tinta (G)">
                <i class="fa-solid fa-fill-drip text-base"></i>
            </button>
            <button onclick="selectTool('eyedropper')" id="tool-eyedropper" class="tool-btn w-11 h-11 rounded-xl bg-slate-800 text-slate-300 hover:bg-slate-700 flex items-center justify-center transition" title="Conta-gotas (I)">
                <i class="fa-solid fa-eye-dropper text-base"></i>
            </button>

            <div class="w-8 h-[1px] bg-slate-800 my-1"></div>

            <button onclick="undo()" class="w-11 h-11 rounded-xl bg-slate-800 text-slate-300 hover:bg-slate-700 flex items-center justify-center transition" title="Desfazer (Ctrl+Z)">
                <i class="fa-solid fa-rotate-left text-base"></i>
            </button>
            <button onclick="redo()" class="w-11 h-11 rounded-xl bg-slate-800 text-slate-300 hover:bg-slate-700 flex items-center justify-center transition" title="Refazer (Ctrl+Y)">
                <i class="fa-solid fa-rotate-right text-base"></i>
            </button>
            <button onclick="clearCanvas()" class="w-11 h-11 rounded-xl bg-rose-950/40 text-rose-400 hover:bg-rose-900/60 border border-rose-800/40 flex items-center justify-center transition" title="Limpar Quadro">
                <i class="fa-solid fa-trash-can text-base"></i>
            </button>
        </aside>

        <!-- Área Central de Desenho (Canvas) -->
        <main class="flex-1 bg-slate-950 flex items-center justify-center p-4 relative overflow-auto checkerboard" id="workspace">
            <div class="relative shadow-2xl rounded-2xl overflow-hidden border-2 border-slate-700/60">
                <canvas id="pixelCanvas" class="cursor-crosshair block bg-transparent"></canvas>
            </div>
        </main>

        <!-- Painel Lateral Direito (Cores, Paletas e Seleção) -->
        <aside class="w-64 bg-slate-900 border-l border-slate-800 flex flex-col p-4 space-y-4 z-10 shrink-0 overflow-y-auto">
            
            <!-- Cor Ativa -->
            <div>
                <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Cor Ativa</h3>
                <div class="flex items-center space-x-3 bg-slate-800 p-2.5 rounded-xl border border-slate-700">
                    <input type="color" id="customColorPicker" value="#3b82f6" class="w-10 h-10 rounded-lg cursor-pointer border-0 bg-transparent p-0">
                    <div class="flex-1">
                        <div id="colorHexText" class="text-sm font-mono font-semibold text-slate-200">#3B82F6</div>
                        <div class="text-[10px] text-slate-400">Clique para personalizar</div>
                    </div>
                </div>
            </div>

            <!-- Painel de Ações de Seleção -->
            <div id="selectionPanel" class="bg-indigo-950/40 border border-indigo-800/50 p-3 rounded-xl space-y-2 hidden">
                <div class="flex items-center justify-between text-indigo-300 font-semibold text-xs mb-1">
                    <span><i class="fa-regular fa-square mr-1.5"></i>Área Selecionada</span>
                    <button onclick="deselectArea()" class="text-slate-400 hover:text-white" title="Cancelar Seleção">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
                <div class="grid grid-cols-2 gap-1.5 text-xs">
                    <button onclick="copySelection()" class="bg-indigo-900/60 hover:bg-indigo-800 text-indigo-200 py-1.5 px-2 rounded-lg font-medium transition flex items-center justify-center space-x-1">
                        <i class="fa-regular fa-copy"></i>
                        <span>Copiar</span>
                    </button>
                    <button onclick="cutSelection()" class="bg-indigo-900/60 hover:bg-indigo-800 text-indigo-200 py-1.5 px-2 rounded-lg font-medium transition flex items-center justify-center space-x-1">
                        <i class="fa-solid fa-scissors"></i>
                        <span>Recortar</span>
                    </button>
                    <button onclick="deleteSelectionArea()" class="col-span-2 bg-rose-950/50 hover:bg-rose-900/60 text-rose-300 py-1.5 px-2 rounded-lg font-medium transition flex items-center justify-center space-x-1 border border-rose-800/40">
                        <i class="fa-regular fa-trash-can"></i>
                        <span>Apagar Área</span>
                    </button>
                </div>
            </div>

            <!-- Paletas de Cores -->
            <div class="flex-1">
                <div class="flex items-center justify-between mb-2">
                    <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400">Paletas Retro</h3>
                    <select id="paletteSelect" onchange="changePalette(this.value)" class="bg-slate-800 text-slate-300 text-xs rounded-lg border border-slate-700 px-2 py-1 outline-none">
                        <option value="pico8">PICO-8 (16)</option>
                        <option value="gameboy">GameBoy (4)</option>
                        <option value="cyberpunk">Cyberpunk (12)</option>
                        <option value="nes">Classic NES (16)</option>
                    </select>
                </div>
                
                <div id="paletteContainer" class="grid grid-cols-4 gap-2 bg-slate-950 p-2.5 rounded-xl border border-slate-800">
                    <!-- Swatches carregadas via JavaScript -->
                </div>
            </div>
        </aside>
    </div>

    <!-- Linha do Tempo / Animação (Parte Inferior) -->
    <footer class="h-44 bg-slate-900 border-t border-slate-800 flex flex-col z-10 shrink-0">
        <!-- Controles da Animação -->
        <div class="px-4 py-2 border-b border-slate-800 flex items-center justify-between bg-slate-900/90">
            <div class="flex items-center space-x-3">
                <button id="playBtn" onclick="togglePlay()" class="px-4 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-bold flex items-center space-x-2 shadow-lg shadow-emerald-600/20 transition">
                    <i class="fa-solid fa-play" id="playIcon"></i>
                    <span id="playText">Reproduzir</span>
                </button>

                <div class="h-4 w-[1px] bg-slate-800"></div>

                <!-- Controle de FPS -->
                <div class="flex items-center space-x-2">
                    <span class="text-xs text-slate-400 font-medium">FPS:</span>
                    <input type="range" id="fpsSlider" min="1" max="24" value="8" oninput="updateFPS(this.value)" class="w-24 accent-indigo-500 cursor-pointer">
                    <span id="fpsVal" class="text-xs font-mono text-indigo-400 font-bold w-6">8</span>
                </div>

                <div class="h-4 w-[1px] bg-slate-800"></div>

                <!-- Alternador de Onion Skin -->
                <button id="onionBtn" onclick="toggleOnionSkin()" class="px-3.5 py-1.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 rounded-xl text-xs font-medium flex items-center space-x-2 transition">
                    <i class="fa-solid fa-clone text-amber-400"></i>
                    <span>Onion Skin: <strong id="onionStatusText" class="text-slate-500">OFF</strong></span>
                </button>
            </div>

            <!-- Botões de Ação para Quadros -->
            <div class="flex items-center space-x-2">
                <button onclick="addFrame()" class="px-3 py-1.5 bg-indigo-600/20 text-indigo-300 hover:bg-indigo-600/30 border border-indigo-500/30 rounded-xl text-xs font-semibold flex items-center space-x-1.5 transition">
                    <i class="fa-solid fa-plus"></i>
                    <span>Novo Quadro</span>
                </button>
                <button onclick="duplicateFrame()" class="px-3 py-1.5 bg-slate-800 text-slate-300 hover:bg-slate-700 border border-slate-700 rounded-xl text-xs font-semibold flex items-center space-x-1.5 transition">
                    <i class="fa-regular fa-copy"></i>
                    <span>Duplicar</span>
                </button>
                <button onclick="deleteFrame()" class="px-3 py-1.5 bg-rose-950/30 text-rose-400 hover:bg-rose-900/40 border border-rose-800/40 rounded-xl text-xs font-semibold flex items-center space-x-1.5 transition">
                    <i class="fa-regular fa-trash-can"></i>
                    <span>Excluir Quadro</span>
                </button>
            </div>
        </div>

        <!-- Faixa de Miniaturas da Linha do Tempo -->
        <div id="timelineStrip" class="flex-1 p-3 flex items-center space-x-3 overflow-x-auto bg-slate-950/50">
            <!-- Cards de quadros gerados via JS -->
        </div>
    </footer>

    <!-- Notificação Toast -->
    <div id="toast" class="fixed bottom-48 right-6 bg-slate-800 border border-slate-700 text-slate-200 px-4 py-2.5 rounded-xl text-xs font-medium shadow-2xl transition opacity-0 pointer-events-none z-50 flex items-center space-x-2">
        <i class="fa-solid fa-circle-info text-indigo-400"></i>
        <span id="toastMsg">Notificação</span>
    </div>

    <script>
        // Estado Geral da Aplicação
        let gridSize = 64;
        let currentColor = '#3b82f6';
        let currentTool = 'pencil';
        let showGrid = true;
        let onionSkin = false;
        let fps = 8;
        let isPlaying = false;
        let playInterval = null;
        let isMouseDown = false;

        // Estrutura de Quadros: Array de matrizes unidimensionais (cores em HEX ou null)
        let frames = [];
        let currentFrameIndex = 0;

        // Pilha de Histórico Desfazer / Refazer
        let undoStack = [];
        let redoStack = [];
        const MAX_STACK = 25;

        // Estado do Utilitário de Seleção
        let selectionStart = null;
        let selectionEnd = null;
        let isSelecting = false;
        let clipboardData = null;

        // Paletas Pré-definidas
        const PALETTES = {
            pico8: ['#000000', '#1D2B53', '#7E2553', '#008751', '#AB5236', '#5F574F', '#C2C3C7', '#FFF1E8', '#FF004D', '#FFA300', '#FFEC27', '#00E436', '#29ADFF', '#83769C', '#FF77A8', '#FFCCAA'],
            gameboy: ['#0f380f', '#306230', '#8bac0f', '#9bbc0f'],
            cyberpunk: ['#08091a', '#1a0b2e', '#431259', '#7a1c72', '#be236a', '#e6475a', '#f78363', '#f2ca6b', '#00f0ff', '#00a8ff', '#7000ff', '#ff0077'],
            nes: ['#7C7C7C', '#0000FC', '#0000BC', '#4428BC', '#940084', '#A80020', '#A81000', '#881400', '#503000', '#007800', '#006800', '#005800', '#004058', '#000000', '#FFFFFF', '#ECECEC']
        };

        // Elementos DOM
        const canvas = document.getElementById('pixelCanvas');
        const ctx = canvas.getContext('2d');
        const customColorPicker = document.getElementById('customColorPicker');
        const colorHexText = document.getElementById('colorHexText');
        const timelineStrip = document.getElementById('timelineStrip');
        const selectionPanel = document.getElementById('selectionPanel');

        window.addEventListener('DOMContentLoaded', () => {
            initApp();
            
            // Eventos do Canvas
            canvas.addEventListener('mousedown', handlePointerDown);
            canvas.addEventListener('mousemove', handlePointerMove);
            window.addEventListener('mouseup', handlePointerUp);

            canvas.addEventListener('touchstart', handlePointerDown, { passive: false });
            canvas.addEventListener('touchmove', handlePointerMove, { passive: false });
            window.addEventListener('touchend', handlePointerUp);

            // Mudança no seletor de cor
            customColorPicker.addEventListener('input', (e) => {
                currentColor = e.target.value;
                colorHexText.textContent = currentColor.toUpperCase();
            });

            // Atalhos de Teclado
            window.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
                
                if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
                    e.preventDefault();
                    undo();
                } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') {
                    e.preventDefault();
                    redo();
                } else if (e.key.toLowerCase() === 'b') selectTool('pencil');
                else if (e.key.toLowerCase() === 's') selectTool('select');
                else if (e.key.toLowerCase() === 'e') selectTool('eraser');
                else if (e.key.toLowerCase() === 'g') selectTool('bucket');
                else if (e.key.toLowerCase() === 'i') selectTool('eyedropper');
                else if (e.code === 'Space') {
                    e.preventDefault();
                    togglePlay();
                }
            });
        });

        function initApp() {
            frames = [createEmptyFrameData()];
            currentFrameIndex = 0;
            loadPalette('pico8');
            updateCanvasDimensions();
            render();
            updateTimelineUI();
        }

        function createEmptyFrameData() {
            return new Array(gridSize * gridSize).fill(null);
        }

        function setGridSize(size) {
            if (gridSize === size) return;
            gridSize = size;

            [16, 32, 64].forEach(s => {
                const btn = document.getElementById(`btn-grid-${s}`);
                if (s === size) {
                    btn.className = "px-2.5 py-1 text-xs font-semibold rounded-lg bg-indigo-600 text-white transition";
                } else {
                    btn.className = "px-2.5 py-1 text-xs font-semibold rounded-lg text-slate-400 hover:text-white transition";
                }
            });

            deselectArea();
            frames = [createEmptyFrameData()];
            currentFrameIndex = 0;
            undoStack = [];
            redoStack = [];

            updateCanvasDimensions();
            render();
            updateTimelineUI();
            showToast(`Tamanho alterado para ${size}x${size}`);
        }

        function updateCanvasDimensions() {
            const displaySize = 512;
            canvas.width = displaySize;
            canvas.height = displaySize;
            render();
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const pixelSize = canvas.width / gridSize;

            // 1. Renderizar Onion Skin (Quadro Anterior)
            if (onionSkin && currentFrameIndex > 0 && !isPlaying) {
                const prevFrame = frames[currentFrameIndex - 1];
                ctx.globalAlpha = 0.35;
                for (let y = 0; y < gridSize; y++) {
                    for (let x = 0; x < gridSize; x++) {
                        const color = prevFrame[y * gridSize + x];
                        if (color) {
                            ctx.fillStyle = color;
                            ctx.fillRect(x * pixelSize, y * pixelSize, pixelSize, pixelSize);
                        }
                    }
                }
                ctx.globalAlpha = 1.0;
            }

            // 2. Renderizar Quadro Atual
            const currentFrame = frames[currentFrameIndex];
            for (let y = 0; y < gridSize; y++) {
                for (let x = 0; x < gridSize; x++) {
                    const color = currentFrame[y * gridSize + x];
                    if (color) {
                        ctx.fillStyle = color;
                        ctx.fillRect(Math.floor(x * pixelSize), Math.floor(y * pixelSize), Math.ceil(pixelSize), Math.ceil(pixelSize));
                    }
                }
            }

            // 3. Renderizar Caixa de Seleção Ativa
            if (selectionStart && selectionEnd) {
                const bounds = getSelectionBounds();
                ctx.strokeStyle = '#6366f1';
                ctx.lineWidth = 2;
                ctx.setLineDash([6, 6]);
                ctx.strokeRect(
                    bounds.x1 * pixelSize,
                    bounds.y1 * pixelSize,
                    (bounds.x2 - bounds.x1 + 1) * pixelSize,
                    (bounds.y2 - bounds.y1 + 1) * pixelSize
                );
                ctx.setLineDash([]);
            }

            // 4. Renderizar Linhas da Grade
            if (showGrid && pixelSize >= 5) {
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                for (let i = 0; i <= gridSize; i++) {
                    const pos = Math.floor(i * pixelSize);
                    ctx.moveTo(pos, 0);
                    ctx.lineTo(pos, canvas.height);
                    ctx.moveTo(0, pos);
                    ctx.lineTo(canvas.width, pos);
                }
                ctx.stroke();
            }
        }

        function getPixelCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            const canvasX = (clientX - rect.left) * scaleX;
            const canvasY = (clientY - rect.top) * scaleY;

            const pixelSize = canvas.width / gridSize;
            const x = Math.floor(canvasX / pixelSize);
            const y = Math.floor(canvasY / pixelSize);

            if (x >= 0 && x < gridSize && y >= 0 && y < gridSize) {
                return { x, y };
            }
            return null;
        }

        function handlePointerDown(e) {
            if (isPlaying) return;
            e.preventDefault();
            isMouseDown = true;

            const coords = getPixelCoords(e);
            if (!coords) return;

            if (currentTool === 'select') {
                isSelecting = true;
                selectionStart = coords;
                selectionEnd = coords;
                selectionPanel.classList.remove('hidden');
                render();
            } else {
                saveStateToUndo();
                applyTool(coords.x, coords.y);
            }
        }

        function handlePointerMove(e) {
            if (!isMouseDown || isPlaying) return;
            e.preventDefault();

            const coords = getPixelCoords(e);
            if (!coords) return;

            if (currentTool === 'select' && isSelecting) {
                selectionEnd = coords;
                render();
            } else if (currentTool === 'pencil' || currentTool === 'eraser') {
                applyTool(coords.x, coords.y);
            }
        }

        function handlePointerUp() {
            if (isMouseDown) {
                isMouseDown = false;
                isSelecting = false;
                updateCurrentFrameThumbnail();
            }
        }

        function applyTool(x, y) {
            const index = y * gridSize + x;
            const frame = frames[currentFrameIndex];

            if (currentTool === 'pencil') {
                if (frame[index] !== currentColor) {
                    frame[index] = currentColor;
                    render();
                }
            } else if (currentTool === 'eraser') {
                if (frame[index] !== null) {
                    frame[index] = null;
                    render();
                }
            } else if (currentTool === 'bucket') {
                const targetColor = frame[index];
                if (targetColor !== currentColor) {
                    floodFill(x, y, targetColor, currentColor);
                    render();
                }
            } else if (currentTool === 'eyedropper') {
                const pickedColor = frame[index];
                if (pickedColor) {
                    currentColor = pickedColor;
                    customColorPicker.value = currentColor;
                    colorHexText.textContent = currentColor.toUpperCase();
                    selectTool('pencil');
                    showToast(`Cor selecionada: ${currentColor}`);
                }
            }
        }

        // Algoritmo de Preenchimento por Inundação (Flood Fill BFS)
        function floodFill(startX, startY, targetColor, replacementColor) {
            const frame = frames[currentFrameIndex];
            const queue = [[startX, startY]];
            const visited = new Set();

            while (queue.length > 0) {
                const [x, y] = queue.shift();
                const key = `${x},${y}`;

                if (x < 0 || x >= gridSize || y < 0 || y >= gridSize) continue;
                if (visited.has(key)) continue;
                visited.add(key);

                const idx = y * gridSize + x;
                if (frame[idx] === targetColor) {
                    frame[idx] = replacementColor;

                    queue.push([x + 1, y]);
                    queue.push([x - 1, y]);
                    queue.push([x, y + 1]);
                    queue.push([x, y - 1]);
                }
            }
        }

        function selectTool(tool) {
            currentTool = tool;
            document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`tool-${tool}`).classList.add('active');

            if (tool !== 'select') {
                deselectArea();
            }
        }

        // Funções da Ferramenta de Seleção
        function getSelectionBounds() {
            if (!selectionStart || !selectionEnd) return { x1: 0, y1: 0, x2: 0, y2: 0 };
            return {
                x1: Math.min(selectionStart.x, selectionEnd.x),
                y1: Math.min(selectionStart.y, selectionEnd.y),
                x2: Math.max(selectionStart.x, selectionEnd.x),
                y2: Math.max(selectionStart.y, selectionEnd.y)
            };
        }

        function deselectArea() {
            selectionStart = null;
            selectionEnd = null;
            selectionPanel.classList.add('hidden');
            render();
        }

        function deleteSelectionArea() {
            const bounds = getSelectionBounds();
            if (!bounds) return;

            saveStateToUndo();
            const frame = frames[currentFrameIndex];

            for (let y = bounds.y1; y <= bounds.y2; y++) {
                for (let x = bounds.x1; x <= bounds.x2; x++) {
                    frame[y * gridSize + x] = null;
                }
            }

            render();
            updateCurrentFrameThumbnail();
            showToast("Área selecionada apagada!");
        }

        function copySelection() {
            const bounds = getSelectionBounds();
            if (!bounds) return;

            const frame = frames[currentFrameIndex];
            clipboardData = {
                w: bounds.x2 - bounds.x1 + 1,
                h: bounds.y2 - bounds.y1 + 1,
                pixels: []
            };

            for (let y = bounds.y1; y <= bounds.y2; y++) {
                for (let x = bounds.x1; x <= bounds.x2; x++) {
                    clipboardData.pixels.push(frame[y * gridSize + x]);
                }
            }

            showToast("Seleção copiada!");
        }

        function cutSelection() {
            copySelection();
            deleteSelectionArea();
            showToast("Seleção recortada!");
        }

        function saveStateToUndo() {
            const snapshot = frames.map(f => [...f]);
            undoStack.push({
                frames: snapshot,
                frameIndex: currentFrameIndex
            });
            if (undoStack.length > MAX_STACK) undoStack.shift();
            redoStack = [];
        }

        function undo() {
            if (undoStack.length === 0) return;
            const snapshot = frames.map(f => [...f]);
            redoStack.push({
                frames: snapshot,
                frameIndex: currentFrameIndex
            });

            const lastState = undoStack.pop();
            frames = lastState.frames;
            currentFrameIndex = Math.min(lastState.frameIndex, frames.length - 1);

            render();
            updateTimelineUI();
            showToast("Ação desfeita");
        }

        function redo() {
            if (redoStack.length === 0) return;
            const snapshot = frames.map(f => [...f]);
            undoStack.push({
                frames: snapshot,
                frameIndex: currentFrameIndex
            });

            const nextState = redoStack.pop();
            frames = nextState.frames;
            currentFrameIndex = Math.min(nextState.frameIndex, frames.length - 1);

            render();
            updateTimelineUI();
            showToast("Ação refeita");
        }

        function clearCanvas() {
            saveStateToUndo();
            frames[currentFrameIndex] = createEmptyFrameData();
            deselectArea();
            render();
            updateTimelineUI();
            showToast("Quadro limpo");
        }

        function addFrame() {
            saveStateToUndo();
            const newFrame = createEmptyFrameData();
            frames.splice(currentFrameIndex + 1, 0, newFrame);
            currentFrameIndex++;
            deselectArea();
            render();
            updateTimelineUI();
            showToast("Novo quadro adicionado");
        }

        function duplicateFrame() {
            saveStateToUndo();
            const duplicated = [...frames[currentFrameIndex]];
            frames.splice(currentFrameIndex + 1, 0, duplicated);
            currentFrameIndex++;
            deselectArea();
            render();
            updateTimelineUI();
            showToast("Quadro duplicado");
        }

        function deleteFrame() {
            if (frames.length <= 1) {
                showToast("Não é possível excluir o único quadro!");
                return;
            }
            saveStateToUndo();
            frames.splice(currentFrameIndex, 1);
            if (currentFrameIndex >= frames.length) {
                currentFrameIndex = frames.length - 1;
            }
            deselectArea();
            render();
            updateTimelineUI();
            showToast("Quadro excluído");
        }

        function selectFrame(index) {
            currentFrameIndex = index;
            deselectArea();
            render();
            updateTimelineUI();
        }

        function togglePlay() {
            isPlaying = !isPlaying;
            const playBtn = document.getElementById('playBtn');
            const playIcon = document.getElementById('playIcon');
            const playText = document.getElementById('playText');

            if (isPlaying) {
                playBtn.className = "px-4 py-1.5 bg-amber-600 hover:bg-amber-500 text-white rounded-xl text-xs font-bold flex items-center space-x-2 shadow-lg shadow-amber-600/20 transition";
                playIcon.className = "fa-solid fa-pause";
                playText.textContent = "Pausar";

                playInterval = setInterval(() => {
                    currentFrameIndex = (currentFrameIndex + 1) % frames.length;
                    render();
                    updateTimelineUI(false);
                }, 1000 / fps);
            } else {
                clearInterval(playInterval);
                playBtn.className = "px-4 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-bold flex items-center space-x-2 shadow-lg shadow-emerald-600/20 transition";
                playIcon.className = "fa-solid fa-play";
                playText.textContent = "Reproduzir";
                render();
            }
        }

        function updateFPS(val) {
            fps = parseInt(val);
            document.getElementById('fpsVal').textContent = fps;
            if (isPlaying) {
                clearInterval(playInterval);
                playInterval = setInterval(() => {
                    currentFrameIndex = (currentFrameIndex + 1) % frames.length;
                    render();
                    updateTimelineUI(false);
                }, 1000 / fps);
            }
        }

        function toggleGrid() {
            showGrid = !showGrid;
            document.getElementById('grid-status-text').textContent = showGrid ? 'ON' : 'OFF';
            document.getElementById('grid-status-text').className = showGrid ? 'text-emerald-400' : 'text-slate-500';
            render();
        }

        function toggleOnionSkin() {
            onionSkin = !onionSkin;
            document.getElementById('onionStatusText').textContent = onionSkin ? 'ON' : 'OFF';
            document.getElementById('onionStatusText').className = onionSkin ? 'text-amber-400' : 'text-slate-500';
            render();
        }

        function updateTimelineUI(autoScroll = true) {
            timelineStrip.innerHTML = '';

            frames.forEach((frameData, idx) => {
                const card = document.createElement('div');
                card.className = `frame-card border-2 ${idx === currentFrameIndex ? 'active border-indigo-500 bg-slate-800' : 'border-slate-800 bg-slate-900'} hover:border-slate-700 rounded-xl p-1.5 flex flex-col items-center cursor-pointer transition shrink-0 group relative`;
                card.onclick = () => selectFrame(idx);

                const thumbCanvas = document.createElement('canvas');
                thumbCanvas.width = 64;
                thumbCanvas.height = 64;
                thumbCanvas.className = "rounded-lg bg-slate-950 checkerboard mb-1 pointer-events-none";

                const thumbCtx = thumbCanvas.getContext('2d');
                const pixelSize = 64 / gridSize;
                for (let y = 0; y < gridSize; y++) {
                    for (let x = 0; x < gridSize; x++) {
                        const col = frameData[y * gridSize + x];
                        if (col) {
                            thumbCtx.fillStyle = col;
                            thumbCtx.fillRect(Math.floor(x * pixelSize), Math.floor(y * pixelSize), Math.ceil(pixelSize), Math.ceil(pixelSize));
                        }
                    }
                }

                const label = document.createElement('span');
                label.className = "text-[10px] font-mono text-slate-400 group-hover:text-slate-200";
                label.textContent = `#${idx + 1}`;

                card.appendChild(thumbCanvas);
                card.appendChild(label);
                timelineStrip.appendChild(card);

                if (idx === currentFrameIndex && autoScroll) {
                    card.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                }
            });
        }

        function updateCurrentFrameThumbnail() {
            updateTimelineUI(false);
        }

        function loadPalette(key) {
            const colors = PALETTES[key] || PALETTES.pico8;
            const container = document.getElementById('paletteContainer');
            container.innerHTML = '';

            colors.forEach(col => {
                const swatch = document.createElement('button');
                swatch.className = "w-full h-8 rounded-lg border border-slate-700 hover:scale-105 transition transform shadow-sm";
                swatch.style.backgroundColor = col;
                swatch.onclick = () => {
                    currentColor = col;
                    customColorPicker.value = col;
                    colorHexText.textContent = col.toUpperCase();
                };
                container.appendChild(swatch);
            });
        }

        function changePalette(key) {
            loadPalette(key);
        }

        function exportFrame() {
            const exportCanvas = document.createElement('canvas');
            const targetSize = 512;
            exportCanvas.width = targetSize;
            exportCanvas.height = targetSize;
            const expCtx = exportCanvas.getContext('2d');
            expCtx.imageSmoothingEnabled = false;

            const pixelSize = targetSize / gridSize;
            const currentFrame = frames[currentFrameIndex];

            for (let y = 0; y < gridSize; y++) {
                for (let x = 0; x < gridSize; x++) {
                    const color = currentFrame[y * gridSize + x];
                    if (color) {
                        expCtx.fillStyle = color;
                        expCtx.fillRect(Math.floor(x * pixelSize), Math.floor(y * pixelSize), Math.ceil(pixelSize), Math.ceil(pixelSize));
                    }
                }
            }

            const link = document.createElement('a');
            link.download = `pixel-art-quadro-${currentFrameIndex + 1}.png`;
            link.href = exportCanvas.toDataURL('image/png');
            link.click();
            showToast("Quadro PNG baixado!");
        }

        function exportSpriteSheet() {
            const exportCanvas = document.createElement('canvas');
            const frameResolution = 64;
            exportCanvas.width = frameResolution * frames.length;
            exportCanvas.height = frameResolution;
            const expCtx = exportCanvas.getContext('2d');
            expCtx.imageSmoothingEnabled = false;

            const pixelSize = frameResolution / gridSize;

            frames.forEach((frame, fIdx) => {
                const offsetX = fIdx * frameResolution;
                for (let y = 0; y < gridSize; y++) {
                    for (let x = 0; x < gridSize; x++) {
                        const color = frame[y * gridSize + x];
                        if (color) {
                            expCtx.fillStyle = color;
                            expCtx.fillRect(Math.floor(offsetX + x * pixelSize), Math.floor(y * pixelSize), Math.ceil(pixelSize), Math.ceil(pixelSize));
                        }
                    }
                }
            });

            const link = document.createElement('a');
            link.download = `spritesheet-${frames.length}quadros.png`;
            link.href = exportCanvas.toDataURL('image/png');
            link.click();
            showToast("Sprite Sheet baixada com sucesso!");
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').textContent = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2000);
        }
    </script>
</body>
</html>
