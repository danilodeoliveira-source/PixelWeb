<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Studio Web - Editor & Estúdio de Pixel Art</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Pixel art canvas checkerboard background */
        .checkerboard {
            background-color: #0f172a;
            background-image: 
                linear-gradient(45deg, #1e293b 25%, transparent 25%), 
                linear-gradient(-45deg, #1e293b 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #1e293b 75%), 
                linear-gradient(-45deg, transparent 75%, #1e293b 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }

        /* Render pixelated crisp canvas without anti-aliasing */
        canvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            touch-action: none;
        }

        /* Crisp CSS Grid Overlay */
        #grid-overlay {
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.2) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.2) 1px, transparent 1px);
            background-size: 3.125% 3.125%; /* Dynamically calculated in JS */
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.25);
        }

        /* Custom scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }

        /* Tool active state */
        .tool-btn {
            width: 36px;
            height: 36px;
            min-width: 36px;
            min-height: 36px;
        }
        .tool-btn.active {
            background-color: #3b82f6 !important;
            color: #ffffff !important;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }

        .palette-swatch {
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }
        .palette-swatch:hover {
            transform: scale(1.15);
            z-index: 10;
        }
        .palette-swatch.selected {
            box-shadow: 0 0 0 2px #38bdf8, 0 0 8px rgba(56, 189, 248, 0.6);
        }

        /* Smooth workspace transform container */
        #canvas-container {
            transform-origin: 0 0;
            will-change: transform;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col overflow-hidden">

    <!-- TOP NAVBAR -->
    <header class="h-14 bg-slate-900 border-b border-slate-800 px-4 flex items-center justify-between z-20 shrink-0 gap-2">
        <!-- Logo, Title & New Studio Button -->
        <div class="flex items-center space-x-3 shrink-0">
            <div class="w-8 h-8 bg-gradient-to-tr from-indigo-500 to-purple-500 rounded-lg flex items-center justify-center text-white shadow-md shadow-indigo-500/20 shrink-0">
                <i class="fa-solid fa-border-all text-base"></i>
            </div>
            <div class="hidden sm:block">
                <h1 id="studio-title-display" class="font-bold text-xs sm:text-sm tracking-wide text-slate-100 leading-tight whitespace-nowrap">Pixel Studio Web</h1>
                <p class="text-[10px] text-slate-400 leading-none whitespace-nowrap">Editor de Pixel Art & Animação</p>
            </div>

            <button onclick="openNewStudioModal()" class="h-8 px-2.5 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold rounded-lg flex items-center space-x-1.5 transition border border-indigo-500/50 shadow-sm whitespace-nowrap">
                <i class="fa-solid fa-plus text-xs"></i>
                <span>Novo Projeto</span>
            </button>
        </div>

        <!-- Custom Canvas Grid Size Control -->
        <div class="h-8 flex items-center bg-slate-950 border border-slate-800 rounded-lg px-1.5 space-x-1 shrink-0">
            <span class="text-[11px] text-slate-400 px-1 font-medium hidden md:inline">Grid:</span>
            <button onclick="setGridSize(16, 16)" id="size-16" class="h-6 px-2 text-[11px] font-semibold rounded transition-colors hover:bg-slate-800 text-slate-300">16²</button>
            <button onclick="setGridSize(32, 32)" id="size-32" class="h-6 px-2 text-[11px] font-semibold rounded transition-colors hover:bg-slate-800 text-slate-300">32²</button>
            <button onclick="setGridSize(64, 64)" id="size-64" class="h-6 px-2 text-[11px] font-semibold rounded transition-colors hover:bg-slate-800 text-slate-300">64²</button>
            <button onclick="setGridSize(128, 128)" id="size-128" class="h-6 px-2 text-[11px] font-semibold rounded transition-colors hover:bg-slate-800 text-slate-300">128²</button>
            
            <button onclick="openCustomSizeModal()" class="h-6 px-2 bg-slate-800 hover:bg-slate-700 text-indigo-300 text-[11px] font-medium rounded border border-slate-700 transition flex items-center space-x-1">
                <i class="fa-solid fa-sliders text-[9px]"></i>
                <span id="dimension-display-btn">32x32</span>
            </button>
        </div>

        <!-- Actions -->
        <div class="flex items-center space-x-1.5 shrink-0">
            <button onclick="openGalleryModal()" class="h-8 px-2.5 bg-slate-800 hover:bg-slate-700 text-emerald-400 text-xs font-semibold rounded-lg border border-slate-700 transition flex items-center space-x-1.5 whitespace-nowrap">
                <i class="fa-solid fa-globe text-emerald-400"></i>
                <span class="hidden md:inline">Galeria</span>
            </button>

            <button onclick="openPublishModal()" class="h-8 px-2.5 bg-sky-600 hover:bg-sky-500 text-white text-xs font-semibold rounded-lg shadow-sm transition flex items-center space-x-1.5 whitespace-nowrap">
                <i class="fa-solid fa-cloud-arrow-up"></i>
                <span class="hidden md:inline">Publicar</span>
            </button>

            <button id="toggle-grid-btn" onclick="toggleGrid()" class="h-8 px-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold rounded-lg border border-slate-700 transition flex items-center space-x-1.5 whitespace-nowrap">
                <i class="fa-solid fa-border-all text-indigo-400"></i>
                <span id="grid-status-text">Grade: ON</span>
            </button>

            <div class="h-4 w-[1px] bg-slate-800 mx-0.5"></div>

            <button onclick="exportPNG()" class="h-8 px-2.5 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold rounded-lg shadow-sm transition flex items-center space-x-1" title="Baixar Frame PNG">
                <i class="fa-solid fa-download text-xs"></i>
                <span>PNG</span>
            </button>

            <button onclick="exportSpriteSheet()" class="h-8 px-2.5 bg-purple-600 hover:bg-purple-500 text-white text-xs font-semibold rounded-lg shadow-sm transition flex items-center space-x-1 hidden lg:flex" title="Baixar Sprite Sheet">
                <i class="fa-solid fa-table-cells text-xs"></i>
                <span>Sprite Sheet</span>
            </button>
        </div>
    </header>

    <!-- MAIN WORKSPACE -->
    <div class="flex-1 flex overflow-hidden relative">

        <!-- LEFT TOOLBAR -->
        <aside class="w-12 bg-slate-900 border-r border-slate-800 flex flex-col items-center py-2 space-y-1.5 z-10 shrink-0">
            <button onclick="setTool('pencil')" id="tool-pencil" class="tool-btn active rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 flex items-center justify-center transition" title="Lápis (P)">
                <i class="fa-solid fa-pencil text-xs"></i>
            </button>

            <button onclick="setTool('eraser')" id="tool-eraser" class="tool-btn rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 flex items-center justify-center transition" title="Borracha (E)">
                <i class="fa-solid fa-eraser text-xs"></i>
            </button>

            <button onclick="setTool('bucket')" id="tool-bucket" class="tool-btn rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 flex items-center justify-center transition" title="Balde de Tintas (G)">
                <i class="fa-solid fa-fill-drip text-xs"></i>
            </button>

            <button onclick="setTool('eyedropper')" id="tool-eyedropper" class="tool-btn rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 flex items-center justify-center transition" title="Conta-gotas (I)">
                <i class="fa-solid fa-eye-dropper text-xs"></i>
            </button>

            <button onclick="setTool('pan')" id="tool-pan" class="tool-btn rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 flex items-center justify-center transition" title="Mover Tela (H / Espaço)">
                <i class="fa-solid fa-hand text-xs"></i>
            </button>

            <div class="w-6 h-[1px] bg-slate-800 my-1"></div>

            <!-- Brush Size Picker -->
            <div class="flex flex-col items-center space-y-1">
                <span class="text-[8px] text-slate-400 font-bold uppercase">Tam</span>
                <button onclick="setBrushSize(1)" id="brush-size-1" class="w-6 h-6 rounded bg-indigo-600 text-white text-[10px] font-bold transition">1</button>
                <button onclick="setBrushSize(2)" id="brush-size-2" class="w-6 h-6 rounded bg-slate-800 text-slate-400 hover:bg-slate-700 text-[10px] font-bold transition">2</button>
                <button onclick="setBrushSize(3)" id="brush-size-3" class="w-6 h-6 rounded bg-slate-800 text-slate-400 hover:bg-slate-700 text-[10px] font-bold transition">3</button>
            </div>

            <div class="w-6 h-[1px] bg-slate-800 my-1"></div>

            <button onclick="undo()" class="tool-btn rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 flex items-center justify-center transition active:scale-95" title="Desfazer (Ctrl+Z)">
                <i class="fa-solid fa-rotate-left text-xs"></i>
            </button>

            <button onclick="redo()" class="tool-btn rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 flex items-center justify-center transition active:scale-95" title="Refazer (Ctrl+Y)">
                <i class="fa-solid fa-rotate-right text-xs"></i>
            </button>

            <button onclick="clearCanvasPrompt()" class="tool-btn rounded-lg bg-slate-800 text-rose-400 hover:bg-rose-500/20 flex items-center justify-center transition active:scale-95" title="Limpar Quadro">
                <i class="fa-solid fa-trash-can text-xs"></i>
            </button>
        </aside>

        <!-- CANVAS CENTER WORKSPACE -->
        <main id="main-workspace" class="flex-1 bg-slate-950 relative overflow-hidden select-none cursor-crosshair">
            
            <!-- Transform Container -->
            <div id="canvas-container" class="absolute left-0 top-0 pointer-events-auto">
                <div id="canvas-wrapper" class="relative checkerboard shadow-2xl overflow-hidden border border-slate-700">
                    <!-- Onion Skin Ghost Canvas -->
                    <canvas id="onion-canvas" class="absolute inset-0 pointer-events-none opacity-30 z-0"></canvas>
                    <!-- Main Active Drawing Canvas -->
                    <canvas id="main-canvas" class="absolute inset-0 z-0"></canvas>
                    <!-- Clean Vector Grid Overlay -->
                    <div id="grid-overlay" class="absolute inset-0 pointer-events-none z-10"></div>
                </div>
            </div>

            <!-- Floating Navigation HUD Bottom Left -->
            <div class="absolute bottom-3 left-3 bg-slate-900/90 backdrop-blur border border-slate-800 px-2.5 py-1 rounded-lg text-[11px] text-slate-300 flex items-center space-x-2.5 pointer-events-none z-10 shadow-lg">
                <div><span class="text-slate-500 font-medium">X:</span> <span id="hud-x" class="font-mono text-indigo-400">0</span></div>
                <div><span class="text-slate-500 font-medium">Y:</span> <span id="hud-y" class="font-mono text-indigo-400">0</span></div>
                <div class="h-3 w-[1px] bg-slate-700"></div>
                <div><span class="text-slate-500 font-medium">Tamanho:</span> <span id="hud-size" class="font-mono text-slate-200">32x32</span></div>
            </div>

            <!-- Floating Zoom Controls Bottom Right -->
            <div class="absolute bottom-3 right-3 bg-slate-900/90 backdrop-blur border border-slate-800 p-1 rounded-xl flex items-center space-x-1 shadow-lg z-10">
                <button onclick="zoomOutCenter()" class="w-7 h-7 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 flex items-center justify-center transition" title="Reduzir Zoom">
                    <i class="fa-solid fa-minus text-xs"></i>
                </button>
                <span id="zoom-display" class="px-1.5 text-xs font-mono font-bold text-indigo-300 min-w-[45px] text-center">100%</span>
                <button onclick="zoomInCenter()" class="w-7 h-7 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 flex items-center justify-center transition" title="Aumentar Zoom">
                    <i class="fa-solid fa-plus text-xs"></i>
                </button>
                <button onclick="recentralizeCanvas()" class="w-7 h-7 rounded-lg bg-indigo-600/30 hover:bg-indigo-600/50 text-indigo-300 flex items-center justify-center transition border border-indigo-500/30 ml-0.5" title="Centralizar na Tela">
                    <i class="fa-solid fa-expand text-xs"></i>
                </button>
            </div>
        </main>

        <!-- RIGHT SIDEBAR (Palettes & Color Picker) -->
        <aside class="w-56 bg-slate-900 border-l border-slate-800 flex flex-col z-10 shrink-0">
            <!-- Palette Preset Header -->
            <div class="p-2.5 border-b border-slate-800 flex items-center justify-between">
                <div class="flex items-center space-x-1.5">
                    <i class="fa-solid fa-palette text-indigo-400 text-xs"></i>
                    <span class="text-[11px] font-bold text-slate-200 uppercase tracking-wider">Paleta</span>
                </div>
                <select id="palette-select" onchange="changePalettePreset(this.value)" class="bg-slate-950 text-slate-300 border border-slate-800 text-[11px] rounded px-1.5 py-0.5 outline-none focus:border-indigo-500">
                    <option value="retro32">Retro 32</option>
                    <option value="pico8">PICO-8</option>
                    <option value="gameboy">GameBoy</option>
                    <option value="cyberpunk">Cyberpunk</option>
                    <option value="pastel">Pastel</option>
                </select>
            </div>

            <!-- Active Color Selector & Custom Hex -->
            <div class="p-2.5 border-b border-slate-800 flex items-center space-x-2.5 bg-slate-950/50">
                <div class="relative group shrink-0">
                    <input type="color" id="color-picker" value="#3b82f6" onchange="setActiveColor(this.value)" class="w-9 h-9 rounded cursor-pointer bg-transparent border-0 opacity-0 absolute inset-0 z-10">
                    <div id="color-preview" class="w-9 h-9 rounded border-2 border-slate-700 shadow-inner flex items-center justify-center bg-[#3b82f6]">
                        <i class="fa-solid fa-eyedropper text-xs text-white/50 group-hover:text-white transition"></i>
                    </div>
                </div>

                <div class="flex-1">
                    <label class="text-[9px] text-slate-400 font-medium block">Hex:</label>
                    <div class="flex items-center space-x-1 mt-0.5">
                        <span class="text-slate-500 text-xs font-mono">#</span>
                        <input type="text" id="hex-input" value="3b82f6" onchange="setActiveColor('#' + this.value)" class="w-full bg-slate-900 border border-slate-800 rounded px-1.5 py-0.5 text-xs font-mono uppercase text-slate-200 outline-none focus:border-indigo-500">
                    </div>
                </div>
            </div>

            <!-- Palette Swatches Grid -->
            <div class="flex-1 p-2.5 overflow-y-auto">
                <div id="palette-grid" class="grid grid-cols-6 gap-1.5">
                    <!-- Swatches dynamically generated -->
                </div>
            </div>

            <!-- Symmetry Options -->
            <div class="p-2.5 border-t border-slate-800 bg-slate-950/30">
                <span class="text-[9px] font-bold text-slate-400 uppercase tracking-wider block mb-1.5">Espelhamento</span>
                <div class="grid grid-cols-2 gap-1.5">
                    <button onclick="toggleSymmetry('h')" id="sym-h-btn" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 text-[11px] font-medium rounded border border-slate-700 transition flex items-center justify-center space-x-1">
                        <i class="fa-solid fa-arrows-left-right text-[10px]"></i>
                        <span>Horiz.</span>
                    </button>
                    <button onclick="toggleSymmetry('v')" id="sym-v-btn" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 text-[11px] font-medium rounded border border-slate-700 transition flex items-center justify-center space-x-1">
                        <i class="fa-solid fa-arrows-up-down text-[10px]"></i>
                        <span>Vert.</span>
                    </button>
                </div>
            </div>
        </aside>
    </div>

    <!-- ANIMATION TIMELINE FOOTER -->
    <footer class="h-20 bg-slate-900 border-t border-slate-800 flex items-center px-3 space-x-3 shrink-0 z-20">
        <!-- Playback Controls -->
        <div class="flex flex-col items-center justify-center space-y-1 border-r border-slate-800 pr-3 shrink-0">
            <button onclick="togglePlayAnimation()" id="play-btn" class="w-9 h-9 rounded-full bg-emerald-600 hover:bg-emerald-500 text-white flex items-center justify-center shadow-md shadow-emerald-600/30 transition active:scale-95">
                <i class="fa-solid fa-play text-xs ml-0.5"></i>
            </button>
            <span class="text-[9px] text-slate-400 font-medium">Play</span>
        </div>

        <!-- Animation Parameters (FPS & Onion Skin) -->
        <div class="flex flex-col space-y-1.5 border-r border-slate-800 pr-3 w-36 shrink-0">
            <div class="flex items-center justify-between">
                <span class="text-[9px] font-bold text-slate-400 uppercase">Velocidade: <span id="fps-val" class="text-indigo-400">8</span> FPS</span>
            </div>
            <input type="range" id="fps-slider" min="1" max="24" value="8" oninput="updateFPS(this.value)" class="w-full accent-indigo-500 bg-slate-950 h-1 rounded-lg appearance-none cursor-pointer">

            <button onclick="toggleOnionSkin()" id="onion-skin-btn" class="px-2 py-0.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-[10px] rounded border border-slate-700 transition flex items-center justify-center space-x-1">
                <i class="fa-solid fa-layer-group text-indigo-400 text-[10px]"></i>
                <span id="onion-skin-text">Onion: OFF</span>
            </button>
        </div>

        <!-- Frame Timeline Thumbnails Container -->
        <div class="flex-1 flex items-center space-x-2 overflow-x-auto py-1" id="timeline-frames">
            <!-- Frame thumbnails dynamically generated -->
        </div>

        <!-- Frame Actions -->
        <div class="flex items-center space-x-1.5 pl-2 border-l border-slate-800 shrink-0">
            <button onclick="addNewFrame()" class="px-2.5 py-1.5 bg-indigo-600/30 hover:bg-indigo-600/50 text-indigo-300 border border-indigo-500/40 text-xs font-semibold rounded-lg flex items-center space-x-1 transition">
                <i class="fa-solid fa-plus text-xs"></i>
                <span>Novo</span>
            </button>
            <button onclick="duplicateCurrentFrame()" class="px-2.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold rounded-lg border border-slate-700 transition flex items-center space-x-1" title="Duplicar Frame Atual">
                <i class="fa-solid fa-copy text-xs"></i>
                <span class="hidden sm:inline">Duplicar</span>
            </button>
        </div>
    </footer>

    <!-- MODAL: Custom Canvas Dimensions -->
    <div id="custom-size-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 w-80 shadow-2xl space-y-4">
            <div class="flex items-center justify-between border-b border-slate-800 pb-2.5">
                <h3 class="font-bold text-xs text-slate-100 flex items-center space-x-2">
                    <i class="fa-solid fa-sliders text-indigo-400"></i>
                    <span>Dimensões Customizadas</span>
                </h3>
                <button onclick="closeCustomSizeModal()" class="text-slate-400 hover:text-slate-200">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div class="space-y-3">
                <div>
                    <label class="text-xs text-slate-400 block mb-1">Largura (px):</label>
                    <input type="number" id="custom-width" min="4" max="500" value="32" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 text-xs font-mono text-slate-200 outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="text-xs text-slate-400 block mb-1">Altura (px):</label>
                    <input type="number" id="custom-height" min="4" max="500" value="32" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 text-xs font-mono text-slate-200 outline-none focus:border-indigo-500">
                </div>
            </div>

            <div class="flex items-center justify-end space-x-2 pt-2 border-t border-slate-800">
                <button onclick="closeCustomSizeModal()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold rounded-lg transition">Cancelar</button>
                <button onclick="applyCustomSize()" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold rounded-lg shadow-md transition">Aplicar</button>
            </div>
        </div>
    </div>

    <!-- MODAL: New Studio -->
    <div id="new-studio-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 w-80 shadow-2xl space-y-4">
            <div class="flex items-center justify-between border-b border-slate-800 pb-2.5">
                <h3 class="font-bold text-xs text-slate-100 flex items-center space-x-2">
                    <i class="fa-solid fa-plus text-indigo-400"></i>
                    <span>Criar Novo Projeto</span>
                </h3>
                <button onclick="closeNewStudioModal()" class="text-slate-400 hover:text-slate-200">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div class="space-y-3">
                <div>
                    <label class="text-xs text-slate-400 block mb-1">Nome do Projeto:</label>
                    <input type="text" id="new-project-title" value="Meu Pixel Art" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-slate-200 outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="text-xs text-slate-400 block mb-1">Tamanho Inicial:</label>
                    <select id="new-project-preset" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-slate-200 outline-none focus:border-indigo-500">
                        <option value="16">16x16 (Sprite Pequeno)</option>
                        <option value="32" selected>32x32 (Sprite Padrão)</option>
                        <option value="64">64x64 (Detalhado)</option>
                        <option value="128">128x128 (Ilustração)</option>
                    </select>
                </div>
            </div>

            <div class="flex items-center justify-end space-x-2 pt-2 border-t border-slate-800">
                <button onclick="closeNewStudioModal()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold rounded-lg transition">Cancelar</button>

                <h3 class="font-bold text-xs text-slate-100 flex items-center space-x-2">

                    <label class="text-xs text-slate-400 block mb-1">Título da Arte:</label>

                <button onclick="confirmPublishArtwork()" class="px-3 py-1.5 bg-sky-600 hover:bg-sky-500 text-white text-xs font-semibold rounded-lg shadow-md transition">Publicar</button>

    <!-- Floating Toast Notification -->
    <div id="toast" class="fixed top-16 right-6 bg-indigo-600 text-white px-3.5 py-2 rounded-xl shadow-xl text-xs font-semibold transition-all transform translate-y-[-20px] opacity-0 pointer-events-none z-50 flex items-center space-x-2">
        <i class="fa-solid fa-circle-check text-sm"></i>
        <span id="toast-message">Mensagem do sistema</span>
    </div>

    <script>
        // Canvas Grid Dimensions
        let gridWidth = 32;
        let gridHeight = 32;

        // Active Drawing Tool State
        let currentTool = 'pencil'; // 'pencil', 'eraser', 'bucket', 'eyedropper', 'pan'
        let activeColor = '#3b82f6';
        let brushSize = 1;
        let isGridVisible = true;
        let symmetryH = false;
        let symmetryV = false;

        // FOCAL ZOOM & PAN ENGINE STATE
        let scale = 1;
        let panX = 0;
        let panY = 0;
        let isPanning = false;
        let startPanX = 0;
        let startPanY = 0;
        let spacePressed = false;

        // Animation Timeline & Frames Data
        let frames = [];
        let currentFrameIndex = 0;
        let isPlaying = false;
        let animationTimer = null;
        let fps = 8;
        let onionSkinActive = false;

        // History Undo / Redo
        let historyStack = [];
        let historyStep = -1;
        const MAX_HISTORY = 30;

        // Preset Color Palettes
        const PALETTES = {
            retro32: [
                '#000000', '#1d2b53', '#7e2553', '#008751', '#ab5236', '#5f574f', '#c2c3c7', '#fff1e8',
                '#ff004d', '#ffa300', '#ffec27', '#00e436', '#29adff', '#83769c', '#ff77a8', '#ffccaa',
                '#291d2d', '#111d35', '#042c26', '#222323', '#2e1f27', '#422419', '#3f3f74', '#5b6ee1',
                '#639bff', '#5fcde4', '#cbdbfc', '#ffffff', '#9badb7', '#847e87', '#696a6a', '#595652'
            ],
            pico8: [
                '#000000', '#1D2B53', '#7E2553', '#008751', '#AB5236', '#5F574F', '#C2C3C7', '#FFF1E8',
                '#FF004D', '#FFA300', '#FFEC27', '#00E436', '#29ADFF', '#83769C', '#FF77A8', '#FFCCAA'
            ],
            gameboy: [
                '#0f380f', '#306230', '#8bac0f', '#9bbc0f'
            ],
            cyberpunk: [
                '#080811', '#1e0036', '#52006A', '#CD113B', '#FF7600', '#FFA900', '#00FFF5', '#00ADB5',
                '#393E46', '#222831', '#FF2E63', '#08D9D6', '#EAEAEA', '#252A34', '#FF9A3C', '#150050'
            ],
            pastel: [
                '#fbf8cc', '#fde4cf', '#ffcfd2', '#f1c0e8', '#cfbaf0', '#a3c4f3', '#90dbf4', '#8eecf5',
                '#98f5e1', '#b9fbc0', '#e8aeb7', '#b8bedd', '#d8e2dc', '#ffe5d9', '#ffcad4', '#f4acb7'
            ]
        };

        // DOM Elements
        const workspace = document.getElementById('main-workspace');
        const canvasContainer = document.getElementById('canvas-container');
        const canvasWrapper = document.getElementById('canvas-wrapper');
        const mainCanvas = document.getElementById('main-canvas');
        const mainCtx = mainCanvas.getContext('2d', { willReadFrequently: true });
        const onionCanvas = document.getElementById('onion-canvas');
        const onionCtx = onionCanvas.getContext('2d');
        const gridOverlay = document.getElementById('grid-overlay');

        window.addEventListener('load', () => {
            initStudio(32, 32);
            renderPaletteSwatches(PALETTES.retro32);

            // Keybindings listener
            window.addEventListener('keydown', handleKeyDown);
            window.addEventListener('keyup', handleKeyUp);

            // Setup mouse drag & zoom handlers
            setupWorkspaceZoomAndPan();
            setupCanvasDrawingEvents();
        });

        function initStudio(width, height) {
            gridWidth = width;
            gridHeight = height;

            // Set internal pixel dimension
            mainCanvas.width = gridWidth;
            mainCanvas.height = gridHeight;
            onionCanvas.width = gridWidth;
            onionCanvas.height = gridHeight;

            // Display dimension on button & HUD
            document.getElementById('dimension-display-btn').innerText = `${gridWidth}x${gridHeight}`;
            document.getElementById('hud-size').innerText = `${gridWidth}x${gridHeight}`;

            // Reset animation frames with 1 transparent frame
            frames = [];
            const initialCanvas = createFrameCanvas(gridWidth, gridHeight);
            frames.push(initialCanvas);
            currentFrameIndex = 0;

            loadCurrentFrameToMain();
            drawGridOverlay();
            recentralizeCanvas();
            renderTimelineThumbnails();
            saveHistory();
        }

        function createFrameCanvas(w, h) {
            const c = document.createElement('canvas');
            c.width = w;
            c.height = h;
            const ctx = c.getContext('2d');
            ctx.clearRect(0, 0, w, h);
            return c;
        }

        function setupWorkspaceZoomAndPan() {
            workspace.addEventListener('wheel', (e) => {
                e.preventDefault();
                const rect = workspace.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;

                const zoomFactor = e.deltaY < 0 ? 1.18 : 1 / 1.18;
                applyFocalZoom(zoomFactor, mouseX, mouseY);
            }, { passive: false });

            workspace.addEventListener('mousedown', (e) => {
                if (e.button === 1 || spacePressed || currentTool === 'pan') {
                    isPanning = true;
                    startPanX = e.clientX - panX;
                    startPanY = e.clientY - panY;
                    workspace.style.cursor = 'grabbing';
                }
            });

            window.addEventListener('mousemove', (e) => {
                if (isPanning) {
                    panX = e.clientX - startPanX;
                    panY = e.clientY - startPanY;
                    updateCanvasTransform();
                }
            });

            window.addEventListener('mouseup', () => {
                if (isPanning) {
                    isPanning = false;
                    workspace.style.cursor = currentTool === 'pan' ? 'grab' : 'crosshair';
                }
            });
        }

        function applyFocalZoom(factor, mouseX, mouseY) {
            const minScale = 0.2;
            const maxScale = 60;

            const newScale = Math.min(Math.max(scale * factor, minScale), maxScale);
            if (newScale === scale) return;

            const canvasX = (mouseX - panX) / scale;
            const canvasY = (mouseY - panY) / scale;

            panX = mouseX - canvasX * newScale;
            panY = mouseY - canvasY * newScale;
            scale = newScale;

            updateCanvasTransform();
        }

        function updateCanvasTransform() {
            canvasContainer.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
            document.getElementById('zoom-display').innerText = `${Math.round(scale * 100)}%`;
        }

        function zoomInCenter() {
            const rect = workspace.getBoundingClientRect();
            applyFocalZoom(1.25, rect.width / 2, rect.height / 2);
        }

        function zoomOutCenter() {
            const rect = workspace.getBoundingClientRect();
            applyFocalZoom(1 / 1.25, rect.width / 2, rect.height / 2);
        }

        function recentralizeCanvas() {
            const rect = workspace.getBoundingClientRect();
            
            const fitScale = Math.min(
                (rect.width * 0.7) / gridWidth,
                (rect.height * 0.7) / gridHeight
            );

            scale = Math.max(Math.min(fitScale, 20), 1);
            
            canvasWrapper.style.width = `${gridWidth}px`;
            canvasWrapper.style.height = `${gridHeight}px`;

            panX = (rect.width - gridWidth * scale) / 2;
            panY = (rect.height - gridHeight * scale) / 2;

            updateCanvasTransform();
        }

        let isDrawing = false;
        let lastX = -1;
        let lastY = -1;

        function setupCanvasDrawingEvents() {
            mainCanvas.addEventListener('mousedown', (e) => {
                if (e.button !== 0 || isPanning || spacePressed || currentTool === 'pan') return;
                isDrawing = true;
                const pt = getPixelCoords(e);
                lastX = pt.x;
                lastY = pt.y;
                executeTool(pt.x, pt.y);
            });

            window.addEventListener('mousemove', (e) => {
                const pt = getPixelCoords(e);
                
                if (pt.x >= 0 && pt.x < gridWidth && pt.y >= 0 && pt.y < gridHeight) {
                    document.getElementById('hud-x').innerText = pt.x;
                    document.getElementById('hud-y').innerText = pt.y;
                }

                if (isDrawing && !isPanning && currentTool !== 'pan') {
                    if (currentTool === 'pencil' || currentTool === 'eraser') {
                        drawLine(lastX, lastY, pt.x, pt.y);
                    } else {
                        executeTool(pt.x, pt.y);
                    }
                    lastX = pt.x;
                    lastY = pt.y;
                }
            });

            window.addEventListener('mouseup', () => {
                if (isDrawing) {
                    isDrawing = false;
                    lastX = -1;
                    lastY = -1;
                    syncMainToFrame();
                    saveHistory();
                    renderTimelineThumbnails();
                }
            });
        }

        function drawLine(x0, y0, x1, y1) {
            const dx = Math.abs(x1 - x0);
            const dy = Math.abs(y1 - y0);
            const sx = x0 < x1 ? 1 : -1;
            const sy = y0 < y1 ? 1 : -1;
            let err = dx - dy;

            let currX = x0;
            let currY = y0;

            while (true) {
                executeTool(currX, currY);
                if (currX === x1 && currY === y1) break;
                const e2 = 2 * err;
                if (e2 > -dy) {
                    err -= dy;
                    currX += sx;
                }
                if (e2 < dx) {
                    err += dx;
                    currY += sy;
                }
            }
        }

        function getPixelCoords(e) {
            const rect = mainCanvas.getBoundingClientRect();
            if (rect.width === 0 || rect.height === 0) return { x: 0, y: 0 };
            const x = Math.floor(((e.clientX - rect.left) / rect.width) * gridWidth);
            const y = Math.floor(((e.clientY - rect.top) / rect.height) * gridHeight);
            return { x, y };
        }

        function executeTool(x, y) {
            if (x < 0 || x >= gridWidth || y < 0 || y >= gridHeight) return;

            if (currentTool === 'pencil') {
                drawPixelWithSymmetry(x, y, activeColor);
            } else if (currentTool === 'eraser') {
                drawPixelWithSymmetry(x, y, null);
            } else if (currentTool === 'bucket') {
                floodFill(x, y, activeColor);
            } else if (currentTool === 'eyedropper') {
                pickColorAt(x, y);
            }
        }

        function drawPixelWithSymmetry(x, y, color) {
            const points = [{ x, y }];

            if (symmetryH) points.push({ x: gridWidth - 1 - x, y });
            if (symmetryV) points.push({ x, y: gridHeight - 1 - y });
            if (symmetryH && symmetryV) points.push({ x: gridWidth - 1 - x, y: gridHeight - 1 - y });

            points.forEach(p => {
                for (let dx = 0; dx < brushSize; dx++) {
                    for (let dy = 0; dy < brushSize; dy++) {
                        const px = p.x + dx;
                        const py = p.y + dy;
                        if (px >= 0 && px < gridWidth && py >= 0 && py < gridHeight) {
                            if (color === null) {
                                mainCtx.clearRect(px, py, 1, 1);
                            } else {
                                mainCtx.fillStyle = color;
                                mainCtx.fillRect(px, py, 1, 1);
                            }
                        }
                    }
                }
            });
        }

        function pickColorAt(x, y) {
            const imgData = mainCtx.getImageData(x, y, 1, 1).data;
            if (imgData[3] === 0) return;
            const hex = "#" + ((1 << 24) + (imgData[0] << 16) + (imgData[1] << 8) + imgData[2]).toString(16).slice(1);
            setActiveColor(hex);
            setTool('pencil');
            showToast('Cor capturada!');
        }

        function floodFill(startX, startY, fillColor) {
            const imgData = mainCtx.getImageData(0, 0, gridWidth, gridHeight);
            const data = imgData.data;

            const targetIdx = (startY * gridWidth + startX) * 4;
            const targetR = data[targetIdx];
            const targetG = data[targetIdx + 1];
            const targetB = data[targetIdx + 2];
            const targetA = data[targetIdx + 3];

            const fillR = parseInt(fillColor.slice(1, 3), 16);
            const fillG = parseInt(fillColor.slice(3, 5), 16);
            const fillB = parseInt(fillColor.slice(5, 7), 16);
            const fillA = 255;

            if (targetR === fillR && targetG === fillG && targetB === fillB && targetA === fillA) return;

            const queue = [{ x: startX, y: startY }];
            const visited = new Uint8Array(gridWidth * gridHeight);

            while (queue.length > 0) {
                const { x, y } = queue.pop();
                const idx = y * gridWidth + x;
                if (visited[idx]) continue;
                visited[idx] = 1;

                const pIdx = idx * 4;
                if (data[pIdx] === targetR && data[pIdx + 1] === targetG && data[pIdx + 2] === targetB && data[pIdx + 3] === targetA) {
                    data[pIdx] = fillR;
                    data[pIdx + 1] = fillG;
                    data[pIdx + 2] = fillB;
                    data[pIdx + 3] = fillA;

                    if (x > 0) queue.push({ x: x - 1, y });
                    if (x < gridWidth - 1) queue.push({ x: x + 1, y });
                    if (y > 0) queue.push({ x, y: y - 1 });
                    if (y < gridHeight - 1) queue.push({ x, y: y + 1 });
                }
            }

            mainCtx.putImageData(imgData, 0, 0);
        }

        /* Clean CSS Grid Overlay Renderer */
        function drawGridOverlay() {
            if (!isGridVisible) {
                gridOverlay.style.display = 'none';
                return;
            }
            gridOverlay.style.display = 'block';
            const cellW = (100 / gridWidth).toFixed(5);
            const cellH = (100 / gridHeight).toFixed(5);
            gridOverlay.style.backgroundSize = `${cellW}% ${cellH}%`;
        }

        function toggleGrid() {
            isGridVisible = !isGridVisible;
            document.getElementById('grid-status-text').innerText = `Grade: ${isGridVisible ? 'ON' : 'OFF'}`;
            drawGridOverlay();
        }

        function updateOnionSkin() {
            onionCtx.clearRect(0, 0, gridWidth, gridHeight);
            if (!onionSkinActive || currentFrameIndex === 0) return;

            const prevFrame = frames[currentFrameIndex - 1];
            onionCtx.drawImage(prevFrame, 0, 0);
        }

        function toggleOnionSkin() {
            onionSkinActive = !onionSkinActive;
            const btnText = document.getElementById('onion-skin-text');
            btnText.innerText = `Onion: ${onionSkinActive ? 'ON' : 'OFF'}`;
            updateOnionSkin();
        }

        function saveHistory() {
            if (historyStep < historyStack.length - 1) {
                historyStack = historyStack.slice(0, historyStep + 1);
            }
            const imgData = mainCtx.getImageData(0, 0, gridWidth, gridHeight);
            historyStack.push(imgData);
            if (historyStack.length > MAX_HISTORY) historyStack.shift();
            historyStep = historyStack.length - 1;
        }

        function undo() {
            if (historyStep > 0) {
                historyStep--;
                mainCtx.putImageData(historyStack[historyStep], 0, 0);
                syncMainToFrame();
                renderTimelineThumbnails();
            }
        }

        function redo() {
            if (historyStep < historyStack.length - 1) {
                historyStep++;
                mainCtx.putImageData(historyStack[historyStep], 0, 0);
                syncMainToFrame();
                renderTimelineThumbnails();
            }
        }

        function clearCanvasPrompt() {
            mainCtx.clearRect(0, 0, gridWidth, gridHeight);
            syncMainToFrame();
            saveHistory();
            renderTimelineThumbnails();
            showToast('Quadro limpo');
        }

        function syncMainToFrame() {
            const frameCanvas = frames[currentFrameIndex];
            const fCtx = frameCanvas.getContext('2d');
            fCtx.clearRect(0, 0, gridWidth, gridHeight);
            fCtx.drawImage(mainCanvas, 0, 0);
        }

        function loadCurrentFrameToMain() {
            mainCtx.clearRect(0, 0, gridWidth, gridHeight);
            mainCtx.drawImage(frames[currentFrameIndex], 0, 0);
            updateOnionSkin();
        }

        function selectFrame(index) {
            syncMainToFrame();
            currentFrameIndex = index;
            loadCurrentFrameToMain();
            historyStack = [];
            historyStep = -1;
            saveHistory();
            renderTimelineThumbnails();
        }

        function addNewFrame() {
            syncMainToFrame();
            const newF = createFrameCanvas(gridWidth, gridHeight);
            frames.push(newF);
            currentFrameIndex = frames.length - 1;
            loadCurrentFrameToMain();
            renderTimelineThumbnails();
            showToast('Novo frame adicionado!');
        }

        function duplicateCurrentFrame() {
            syncMainToFrame();
            const dup = createFrameCanvas(gridWidth, gridHeight);
            const dCtx = dup.getContext('2d');
            dCtx.drawImage(frames[currentFrameIndex], 0, 0);

            frames.splice(currentFrameIndex + 1, 0, dup);
            currentFrameIndex++;
            loadCurrentFrameToMain();
            renderTimelineThumbnails();
            showToast('Frame duplicado!');
        }

        function deleteFrame(index, event) {
            if (event) event.stopPropagation();
            if (frames.length <= 1) {
                showToast('É necessário manter pelo menos 1 frame!');
                return;
            }
            frames.splice(index, 1);
            if (currentFrameIndex >= frames.length) {
                currentFrameIndex = frames.length - 1;
            }
            loadCurrentFrameToMain();
            renderTimelineThumbnails();
        }

        function renderTimelineThumbnails() {
            const container = document.getElementById('timeline-frames');
            container.innerHTML = '';

            frames.forEach((frameCanvas, idx) => {
                const isSelected = idx === currentFrameIndex;

                const card = document.createElement('div');
                card.className = `relative shrink-0 w-14 h-14 rounded-lg border-2 cursor-pointer overflow-hidden transition group checkerboard flex items-center justify-center ${isSelected ? 'border-indigo-500 ring-2 ring-indigo-500/40' : 'border-slate-800 hover:border-slate-700'}`;
                card.onclick = () => selectFrame(idx);

                const thumbImg = document.createElement('img');
                thumbImg.src = frameCanvas.toDataURL();
                thumbImg.className = 'w-full h-full object-contain pointer-events-none image-pixelated';

                const badge = document.createElement('span');
                badge.className = 'absolute top-0.5 left-0.5 bg-slate-900/80 text-slate-300 text-[8px] font-mono px-1 rounded';
                badge.innerText = idx + 1;

                if (frames.length > 1) {
                    const delBtn = document.createElement('button');
                    delBtn.className = 'absolute top-0.5 right-0.5 w-3.5 h-3.5 bg-rose-600 text-white rounded flex items-center justify-center opacity-0 group-hover:opacity-100 transition text-[8px] hover:bg-rose-500';
                    delBtn.innerHTML = '<i class="fa-solid fa-xmark"></i>';
                    delBtn.onclick = (e) => deleteFrame(idx, e);
                    card.appendChild(delBtn);
                }

                card.appendChild(thumbImg);
                card.appendChild(badge);
                container.appendChild(card);
            });
        }

        function togglePlayAnimation() {
            isPlaying = !isPlaying;
            const playBtn = document.getElementById('play-btn');

            if (isPlaying) {
                playBtn.className = 'w-9 h-9 rounded-full bg-amber-600 hover:bg-amber-500 text-white flex items-center justify-center shadow-md transition active:scale-95';
                playBtn.innerHTML = '<i class="fa-solid fa-pause text-xs"></i>';
                
                syncMainToFrame();
                animationTimer = setInterval(() => {
                    currentFrameIndex = (currentFrameIndex + 1) % frames.length;
                    loadCurrentFrameToMain();
                    renderTimelineThumbnails();
                }, 1000 / fps);
            } else {
                playBtn.className = 'w-9 h-9 rounded-full bg-emerald-600 hover:bg-emerald-500 text-white flex items-center justify-center shadow-md transition active:scale-95';
                playBtn.innerHTML = '<i class="fa-solid fa-play text-xs ml-0.5"></i>';
                clearInterval(animationTimer);
            }
        }

        function updateFPS(val) {
            fps = parseInt(val);
            document.getElementById('fps-val').innerText = fps;
            if (isPlaying) {
                clearInterval(animationTimer);
                animationTimer = setInterval(() => {
                    currentFrameIndex = (currentFrameIndex + 1) % frames.length;
                    loadCurrentFrameToMain();
                    renderTimelineThumbnails();
                }, 1000 / fps);
            }
        }

        function setTool(tool) {
            currentTool = tool;
            document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
            const activeBtn = document.getElementById(`tool-${tool}`);
            if (activeBtn) activeBtn.classList.add('active');

            workspace.style.cursor = tool === 'pan' ? 'grab' : 'crosshair';
        }

        function setBrushSize(size) {
            brushSize = size;
            for (let i = 1; i <= 3; i++) {
                const btn = document.getElementById(`brush-size-${i}`);
                if (i === size) {
                    btn.className = 'w-6 h-6 rounded bg-indigo-600 text-white text-[10px] font-bold transition';
                } else {
                    btn.className = 'w-6 h-6 rounded bg-slate-800 text-slate-400 hover:bg-slate-700 text-[10px] font-bold transition';
                }
            }
        }

        function setActiveColor(color) {
            activeColor = color;
            document.getElementById('color-preview').style.backgroundColor = color;
            document.getElementById('hex-input').value = color.replace('#', '');
            document.getElementById('color-picker').value = color;

            document.querySelectorAll('.palette-swatch').forEach(s => {
                if (s.dataset.color.toLowerCase() === color.toLowerCase()) {
                    s.classList.add('selected');
                } else {
                    s.classList.remove('selected');
                }
            });
        }

        function renderPaletteSwatches(colorList) {
            const grid = document.getElementById('palette-grid');
            grid.innerHTML = '';

            colorList.forEach(color => {
                const swatch = document.createElement('div');
                swatch.className = `palette-swatch w-6 h-6 rounded border border-slate-700/50 cursor-pointer ${color.toLowerCase() === activeColor.toLowerCase() ? 'selected' : ''}`;
                swatch.style.backgroundColor = color;
                swatch.dataset.color = color;
                swatch.onclick = () => setActiveColor(color);
                grid.appendChild(swatch);
            });
        }

        function changePalettePreset(key) {
            if (PALETTES[key]) {
                renderPaletteSwatches(PALETTES[key]);
            }
        }

        function toggleSymmetry(type) {
            if (type === 'h') {
                symmetryH = !symmetryH;
                const btn = document.getElementById('sym-h-btn');
                btn.className = symmetryH 
                    ? 'px-2 py-1 bg-indigo-600 text-white text-[11px] font-medium rounded border border-indigo-500 transition flex items-center justify-center space-x-1'
                    : 'px-2 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 text-[11px] font-medium rounded border border-slate-700 transition flex items-center justify-center space-x-1';
            } else {
                symmetryV = !symmetryV;
                const btn = document.getElementById('sym-v-btn');
                btn.className = symmetryV 
                    ? 'px-2 py-1 bg-indigo-600 text-white text-[11px] font-medium rounded border border-indigo-500 transition flex items-center justify-center space-x-1'
                    : 'px-2 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 text-[11px] font-medium rounded border border-slate-700 transition flex items-center justify-center space-x-1';
            }
        }

        function handleKeyDown(e) {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;

            if (e.code === 'Space' && !spacePressed) {
                spacePressed = true;
                workspace.style.cursor = 'grab';
            }
            if (e.key === 'p' || e.key === 'P') setTool('pencil');
            if (e.key === 'e' || e.key === 'E') setTool('eraser');
            if (e.key === 'g' || e.key === 'G') setTool('bucket');
            if (e.key === 'i' || e.key === 'I') setTool('eyedropper');
            if (e.key === 'h' || e.key === 'H') setTool('pan');

            if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
                e.preventDefault();
                undo();
            }
            if ((e.ctrlKey || e.metaKey) && e.key === 'y') {
                e.preventDefault();
                redo();
            }
        }

        function handleKeyUp(e) {
            if (e.code === 'Space') {
                spacePressed = false;
                workspace.style.cursor = currentTool === 'pan' ? 'grab' : 'crosshair';
            }
        }

        function exportPNG() {
            syncMainToFrame();
            const link = document.createElement('a');
            link.download = `pixel-art-frame-${currentFrameIndex + 1}.png`;
            link.href = mainCanvas.toDataURL('image/png');
            link.click();
            showToast('Frame PNG baixado com sucesso!');
        }

        function exportSpriteSheet() {
            syncMainToFrame();
            const sheet = document.createElement('canvas');
            sheet.width = gridWidth * frames.length;
            sheet.height = gridHeight;
            const sCtx = sheet.getContext('2d');

            frames.forEach((fCanvas, idx) => {
                sCtx.drawImage(fCanvas, idx * gridWidth, 0);
            });

            const link = document.createElement('a');
            link.download = `spritesheet-${frames.length}-frames.png`;
            link.href = sheet.toDataURL('image/png');
            link.click();
            showToast('Sprite Sheet baixado com sucesso!');
        }

        function openCustomSizeModal() {
            document.getElementById('custom-width').value = gridWidth;
            document.getElementById('custom-height').value = gridHeight;
            document.getElementById('custom-size-modal').classList.remove('hidden');
        }

        function closeCustomSizeModal() {
            document.getElementById('custom-size-modal').classList.add('hidden');
        }

        function applyCustomSize() {
            const w = parseInt(document.getElementById('custom-width').value);
            const h = parseInt(document.getElementById('custom-height').value);
            if (isNaN(w) || isNaN(h) || w < 4 || h < 4 || w > 500 || h > 500) {
                showToast('Insira um tamanho válido entre 4x4 e 500x500');
                return;
            }
            initStudio(w, h);
            closeCustomSizeModal();
            showToast(`Dimensão alterada para ${w}x${h}`);
        }

        function setGridSize(w, h) {
            initStudio(w, h);
            showToast(`Grid ajustado para ${w}x${h}`);
        }

        function openNewStudioModal() {
            document.getElementById('new-studio-modal').classList.remove('hidden');
        }

        function closeNewStudioModal() {
            document.getElementById('new-studio-modal').classList.add('hidden');
        }

        function createNewStudioConfirm() {
            const title = document.getElementById('new-project-title').value;
            const size = parseInt(document.getElementById('new-project-preset').value);
            document.getElementById('studio-title-display').innerText = title || 'Pixel Studio Web';
            initStudio(size, size);
            closeNewStudioModal();
            showToast('Novo projeto inicializado!');
        }

        function openGalleryModal() {
            document.getElementById('gallery-modal').classList.remove('hidden');
            const grid = document.getElementById('gallery-grid');
            grid.innerHTML = '<div class="col-span-3 py-12 text-center text-slate-400 text-xs">A galeria comunitária está pronta. Publique suas criações para visualizá-las aqui!</div>';
        }

        function closeGalleryModal() {
            document.getElementById('gallery-modal').classList.add('hidden');
        }

        function openPublishModal() {
            document.getElementById('publish-modal').classList.remove('hidden');
        }

        function closePublishModal() {
            document.getElementById('publish-modal').classList.add('hidden');
        }

        function confirmPublishArtwork() {
            closePublishModal();
            showToast('Arte publicada com sucesso!');
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').innerText = msg;
            toast.classList.remove('translate-y-[-20px]', 'opacity-0', 'pointer-events-none');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-[-20px]', 'opacity-0', 'pointer-events-none');
            }, 3000);
        }
    </script>
</body>
</html>
